name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zlib1g-dev libncurses5-dev libgdbm-dev libncursesw5-dev libssl-dev libsqlite3-dev libreadline-dev libffi-dev wget curl libbz2-dev openjdk-17-jdk unzip zip autoconf automake libtool pkg-config

      - name: Install Pip Dependencies
        run: |
          pip install --upgrade pip
          pip install cython virtualenv buildozer

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
